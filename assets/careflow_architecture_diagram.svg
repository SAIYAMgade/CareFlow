<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <text x="500" y="36" fill="#0f172a" font-size="20" font-weight="700" text-anchor="middle">CareFlow System Architecture &amp; Data Pipeline</text>
  <text x="500" y="56" fill="#64748b" font-size="12" text-anchor="middle">Enterprise Layered Design with Oracle Database Free (23ai) as Single Source of Truth</text>

  <!-- Layer 1: Client -->
  <g transform="translate(60, 80)">
    <rect width="880" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1" filter="url(#boxShadow)"/>
    <rect width="180" height="70" rx="8" fill="#0284c7"/>
    <text x="90" y="32" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Presentation Tier</text>
    <text x="90" y="48" fill="#bae6fd" font-size="10" text-anchor="middle">SPA Client</text>

    <!-- Component Cards -->
    <g transform="translate(200, 12)">
      <rect width="150" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="75" y="24" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">React 18 + TS</text>
      <text x="75" y="38" fill="#64748b" font-size="9" text-anchor="middle">Typed API Clients</text>
    </g>

    <g transform="translate(370, 12)">
      <rect width="150" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="75" y="24" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">Tailwind CSS</text>
      <text x="75" y="38" fill="#64748b" font-size="9" text-anchor="middle">Accessible Clinical UI</text>
    </g>

    <g transform="translate(540, 12)">
      <rect width="150" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="75" y="24" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">9 Modular Views</text>
      <text x="75" y="38" fill="#64748b" font-size="9" text-anchor="middle">Dash, Registry, Reports</text>
    </g>

    <g transform="translate(710, 12)">
      <rect width="150" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="75" y="24" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">State Management</text>
      <text x="75" y="38" fill="#64748b" font-size="9" text-anchor="middle">Real-time Reactive Sync</text>
    </g>
  </g>

  <!-- Arrow -->
  <path d="M500 150 v25" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 2: API Gateway -->
  <g transform="translate(60, 175)">
    <rect width="880" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1" filter="url(#boxShadow)"/>
    <rect width="180" height="70" rx="8" fill="#0d9488"/>
    <text x="90" y="32" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Application Tier</text>
    <text x="90" y="48" fill="#99f6e4" font-size="10" text-anchor="middle">FastAPI Gateway</text>

    <!-- Component Cards -->
    <g transform="translate(200, 12)">
      <rect width="150" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="75" y="24" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">Pydantic v2 Models</text>
      <text x="75" y="38" fill="#64748b" font-size="9" text-anchor="middle">Strict Schema Validation</text>
    </g>

    <g transform="translate(370, 12)">
      <rect width="150" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="75" y="24" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">RESTful Endpoints</text>
      <text x="75" y="38" fill="#64748b" font-size="9" text-anchor="middle">/api/patients, /encounters</text>
    </g>

    <g transform="translate(540, 12)">
      <rect width="150" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="75" y="24" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">Exception Handler</text>
      <text x="75" y="38" fill="#64748b" font-size="9" text-anchor="middle">409 Conflicts, 404s</text>
    </g>

    <g transform="translate(710, 12)">
      <rect width="150" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="75" y="24" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">CSV Safe Exporter</text>
      <text x="75" y="38" fill="#64748b" font-size="9" text-anchor="middle">Formula Injection Shield</text>
    </g>
  </g>

  <!-- Arrow -->
  <path d="M500 245 v25" stroke="#94a3b8" stroke-width="2"/>

  <!-- Layer 3: Domain & Service Layer -->
  <g transform="translate(60, 270)">
    <rect width="880" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1" filter="url(#boxShadow)"/>
    <rect width="180" height="70" rx="8" fill="#4f46e5"/>
    <text x="90" y="32" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Domain Services</text>
    <text x="90" y="48" fill="#c7d2fe" font-size="10" text-anchor="middle">Workflow Safety Gates</text>

    <!-- Component Cards -->
    <g transform="translate(200, 12)">
      <rect width="150" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="75" y="24" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">Check-In Atomic Svc</text>
      <text x="75" y="38" fill="#64748b" font-size="9" text-anchor="middle">Appt + Encounter Link</text>
    </g>

    <g transform="translate(370, 12)">
      <rect width="150" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="75" y="24" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">Pending Orders Gate</text>
      <text x="75" y="38" fill="#be123c" font-size="9" font-weight="600" text-anchor="middle">Blocks Premature Signoff</text>
    </g>

    <g transform="translate(540, 12)">
      <rect width="150" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="75" y="24" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">Order-Result Tx</text>
      <text x="75" y="38" fill="#64748b" font-size="9" text-anchor="middle">1-to-1 Lab Posting</text>
    </g>

    <g transform="translate(710, 12)">
      <rect width="150" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="75" y="24" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">DQ Invariant Auditor</text>
      <text x="75" y="38" fill="#64748b" font-size="9" text-anchor="middle">5 Automated Rule Checks</text>
    </g>
  </g>

  <!-- Arrow -->
  <path d="M500 340 v25" stroke="#94a3b8" stroke-width="2"/>

  <!-- Layer 4: Persistence Tier (Oracle Database Free) -->
  <g transform="translate(60, 365)">
    <rect width="880" height="110" rx="8" fill="#071628" stroke="#1e293b" filter="url(#boxShadow)"/>
    <rect width="180" height="110" rx="8" fill="#dc2626"/>
    <text x="90" y="44" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Database Tier</text>
    <text x="90" y="60" fill="#fecaca" font-size="10" text-anchor="middle">Oracle DB Free 23ai</text>
    <text x="90" y="76" fill="#ffffff" font-size="9" font-family="monospace" text-anchor="middle">FREEPDB1 : 1521</text>

    <!-- Oracle Schema Components -->
    <g transform="translate(200, 14)">
      <rect width="150" height="82" rx="6" fill="#0f2438" stroke="#1e3a5f"/>
      <text x="75" y="22" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Relational Schema</text>
      <text x="75" y="40" fill="#94a3b8" font-size="9" text-anchor="middle">9 Primary Tables</text>
      <text x="75" y="55" fill="#94a3b8" font-size="9" text-anchor="middle">Unique MRN &amp; Status CHKs</text>
      <text x="75" y="70" fill="#94a3b8" font-size="9" text-anchor="middle">Covering B-Tree Indexes</text>
    </g>

    <g transform="translate(370, 14)">
      <rect width="150" height="82" rx="6" fill="#0f2438" stroke="#1e3a5f"/>
      <text x="75" y="22" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">PL/SQL Package</text>
      <text x="75" y="40" fill="#94a3b8" font-size="9" text-anchor="middle">CAREFLOW_WORKFLOW_PKG</text>
      <text x="75" y="55" fill="#94a3b8" font-size="9" text-anchor="middle">Row-locking FOR UPDATE</text>
      <text x="75" y="70" fill="#94a3b8" font-size="9" text-anchor="middle">Custom ORA-20001 Exceptions</text>
    </g>

    <g transform="translate(540, 14)">
      <rect width="150" height="82" rx="6" fill="#0f2438" stroke="#1e3a5f"/>
      <text x="75" y="22" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">SQL Reporting</text>
      <text x="75" y="40" fill="#94a3b8" font-size="9" text-anchor="middle">8 CTE Analytic Reports</text>
      <text x="75" y="55" fill="#94a3b8" font-size="9" text-anchor="middle">PERCENTILE_CONT(0.5)</text>
      <text x="75" y="70" fill="#94a3b8" font-size="9" text-anchor="middle">Reusable SQL Views</text>
    </g>

    <g transform="translate(710, 14)">
      <rect width="150" height="82" rx="6" fill="#0f2438" stroke="#1e3a5f"/>
      <text x="75" y="22" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Audit &amp; Telemetry</text>
      <text x="75" y="40" fill="#94a3b8" font-size="9" text-anchor="middle">AUDIT_LOG (CLOB Diff)</text>
      <text x="75" y="55" fill="#94a3b8" font-size="9" text-anchor="middle">STATUS_HISTORY Timeline</text>
      <text x="75" y="70" fill="#94a3b8" font-size="9" text-anchor="middle">Correlation GUIDs</text>
    </g>
  </g>
</svg>
