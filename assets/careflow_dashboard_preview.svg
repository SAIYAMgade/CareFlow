<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%" style="background:#f8fafc; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <!-- Sidebar -->
  <rect x="0" y="0" width="240" height="700" fill="#071628"/>
  <rect x="240" y="0" width="960" height="56" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Logo -->
  <g transform="translate(20, 16)">
    <rect width="28" height="28" rx="6" fill="#14b8a6" fill-opacity="0.2"/>
    <path d="M14 6v16M6 14h16" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round"/>
    <text x="38" y="19" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="-0.3">CareFlow</text>
    <text x="38" y="29" fill="#5eead4" font-size="9" font-family="monospace" letter-spacing="1">CLINICAL OPS</text>
  </g>

  <!-- Nav Items -->
  <g transform="translate(12, 70)" font-size="13" font-weight="500">
    <rect x="0" y="0" width="216" height="36" rx="6" fill="#0d9488"/>
    <text x="36" y="23" fill="#ffffff">Dashboard</text>
    <circle cx="20" cy="18" r="4" fill="#ffffff"/>

    <text x="36" y="63" fill="#94a3b8">Patient Registry</text>
    <circle cx="20" cy="58" r="4" fill="#64748b"/>

    <text x="36" y="103" fill="#94a3b8">Appointments</text>
    <circle cx="20" cy="98" r="4" fill="#64748b"/>
    <rect x="175" y="88" width="26" height="18" rx="9" fill="#fef3c7"/>
    <text x="188" y="101" fill="#92400e" font-size="10" font-weight="700" text-anchor="middle">7</text>

    <text x="36" y="143" fill="#94a3b8">Encounters</text>
    <circle cx="20" cy="138" r="4" fill="#64748b"/>

    <text x="36" y="183" fill="#94a3b8">Orders &amp; Results</text>
    <circle cx="20" cy="178" r="4" fill="#64748b"/>

    <text x="36" y="223" fill="#94a3b8">Reporting Workspace</text>
    <circle cx="20" cy="218" r="4" fill="#64748b"/>

    <text x="36" y="263" fill="#94a3b8">Data Quality Audit</text>
    <circle cx="20" cy="258" r="4" fill="#64748b"/>
    <rect x="175" y="248" width="26" height="18" rx="9" fill="#ffe4e6"/>
    <text x="188" y="261" fill="#be123c" font-size="10" font-weight="700" text-anchor="middle">5</text>

    <text x="36" y="303" fill="#94a3b8">Audit Explorer</text>
    <circle cx="20" cy="298" r="4" fill="#64748b"/>

    <text x="36" y="343" fill="#94a3b8">System Health</text>
    <circle cx="20" cy="338" r="4" fill="#64748b"/>
  </g>

  <!-- Topbar Search & Pill -->
  <g transform="translate(260, 12)">
    <rect width="280" height="32" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="12" y="20" fill="#94a3b8" font-size="12">Search patients, MRN, lab orders...</text>
  </g>

  <!-- Environment Badge -->
  <g transform="translate(680, 14)">
    <rect width="320" height="28" rx="14" fill="#fef3c7" stroke="#fde68a"/>
    <circle cx="16" cy="14" r="4" fill="#f59e0b"/>
    <text x="28" y="18" fill="#92400e" font-size="11" font-weight="600">SIMULATED CLINICAL ENVIRONMENT - SYNTHETIC DATA</text>
  </g>

  <!-- User Profile -->
  <g transform="translate(1080, 12)">
    <circle cx="16" cy="16" r="16" fill="#0f766e"/>
    <text x="16" y="20" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">ER</text>
    <text x="40" y="16" fill="#0f172a" font-size="11" font-weight="600">Dr. E. Rostova</text>
    <text x="40" y="27" fill="#64748b" font-size="9">Cardiology</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(264, 76)">
    <!-- Page Title -->
    <text x="0" y="20" fill="#0f172a" font-size="20" font-weight="700">Clinic Operations Dashboard</text>
    <text x="0" y="38" fill="#64748b" font-size="12">Derived from live persisted records • Oracle Database Free Single Source of Truth</text>

    <!-- Data Quality Alert Banner -->
    <g transform="translate(0, 52)">
      <rect width="912" height="42" rx="8" fill="#fffbeb" stroke="#fef3c7" stroke-width="1.5"/>
      <circle cx="24" cy="21" r="9" fill="#f59e0b"/>
      <text x="24" y="25" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">!</text>
      <text x="44" y="20" fill="#78350f" font-size="12" font-weight="600">5 Data Quality Exceptions Flagged for Clinical Investigation</text>
      <text x="44" y="33" fill="#92400e" font-size="10">Missing check-in timestamps and open orders on completed visits detected in live audit</text>
      <text x="820" y="26" fill="#b45309" font-size="11" font-weight="600">Review Issues →</text>
    </g>

    <!-- 8 Metric Cards -->
    <g transform="translate(0, 108)">
      <!-- Card 1 -->
      <g filter="url(#shadow)">
        <rect width="216" height="74" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="14" y="22" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase">Today's Appts</text>
        <text x="14" y="52" fill="#0f172a" font-size="24" font-weight="700">15</text>
        <rect x="172" y="14" width="30" height="30" rx="6" fill="#eff6ff"/>
        <text x="187" y="34" fill="#2563eb" font-size="14" text-anchor="middle">📅</text>
        <text x="14" y="66" fill="#10b981" font-size="9">● 5 Clinic Depts</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(232, 0)" filter="url(#shadow)">
        <rect width="216" height="74" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="14" y="22" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase">Checked In</text>
        <text x="14" y="52" fill="#0f172a" font-size="24" font-weight="700">11</text>
        <rect x="172" y="14" width="30" height="30" rx="6" fill="#ecfdf5"/>
        <text x="187" y="34" fill="#059669" font-size="14" text-anchor="middle">✓</text>
        <text x="14" y="66" fill="#059669" font-size="9">Reception Arrived</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(464, 0)" filter="url(#shadow)">
        <rect width="216" height="74" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="14" y="22" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase">Patients Waiting</text>
        <text x="14" y="52" fill="#d97706" font-size="24" font-weight="700">7</text>
        <rect x="172" y="14" width="30" height="30" rx="6" fill="#fef3c7"/>
        <text x="187" y="34" fill="#d97706" font-size="14" text-anchor="middle">⏳</text>
        <text x="14" y="66" fill="#d97706" font-size="9">In Waiting Lounge</text>
      </g>

      <!-- Card 4 -->
      <g transform="translate(696, 0)" filter="url(#shadow)">
        <rect width="216" height="74" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="14" y="22" fill="#64748b" font-size="10" font-weight="600" text-transform="uppercase">In Progress</text>
        <text x="14" y="52" fill="#0f172a" font-size="24" font-weight="700">52</text>
        <rect x="172" y="14" width="30" height="30" rx="6" fill="#f5f3ff"/>
        <text x="187" y="34" fill="#7c3aed" font-size="14" text-anchor="middle">🩺</text>
        <text x="14" y="66" fill="#64748b" font-size="9">Clinical Exams</text>
      </g>
    </g>

    <!-- Two Big Analytics Charts -->
    <g transform="translate(0, 200)">
      <!-- Left Chart: Appointment Volume by Hour -->
      <g filter="url(#shadow)">
        <rect width="446" height="230" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="16" y="24" fill="#0f172a" font-size="13" font-weight="700">Appointment Volume by Hour</text>
        <text x="16" y="38" fill="#64748b" font-size="10">Scheduled vs. Checked-in patient arrivals</text>

        <!-- Grid Lines -->
        <line x1="40" y1="60" x2="420" y2="60" stroke="#f1f5f9" stroke-dasharray="2,2"/>
        <line x1="40" y1="100" x2="420" y2="100" stroke="#f1f5f9" stroke-dasharray="2,2"/>
        <line x1="40" y1="140" x2="420" y2="140" stroke="#f1f5f9" stroke-dasharray="2,2"/>
        <line x1="40" y1="180" x2="420" y2="180" stroke="#cbd5e1"/>

        <!-- Bars -->
        <!-- 08:00 -->
        <rect x="60" y="90" width="12" height="90" fill="#cbd5e1" rx="2"/>
        <rect x="74" y="110" width="12" height="70" fill="#0d9488" rx="2"/>
        <text x="73" y="194" fill="#64748b" font-size="9" text-anchor="middle">8am</text>

        <!-- 09:00 -->
        <rect x="105" y="70" width="12" height="110" fill="#cbd5e1" rx="2"/>
        <rect x="119" y="85" width="12" height="95" fill="#0d9488" rx="2"/>
        <text x="118" y="194" fill="#64748b" font-size="9" text-anchor="middle">9am</text>

        <!-- 10:00 -->
        <rect x="150" y="55" width="12" height="125" fill="#cbd5e1" rx="2"/>
        <rect x="164" y="65" width="12" height="115" fill="#0d9488" rx="2"/>
        <text x="163" y="194" fill="#64748b" font-size="9" text-anchor="middle">10am</text>

        <!-- 11:00 -->
        <rect x="195" y="80" width="12" height="100" fill="#cbd5e1" rx="2"/>
        <rect x="209" y="95" width="12" height="85" fill="#0d9488" rx="2"/>
        <text x="208" y="194" fill="#64748b" font-size="9" text-anchor="middle">11am</text>

        <!-- 12:00 -->
        <rect x="240" y="120" width="12" height="60" fill="#cbd5e1" rx="2"/>
        <rect x="254" y="135" width="12" height="45" fill="#0d9488" rx="2"/>
        <text x="253" y="194" fill="#64748b" font-size="9" text-anchor="middle">12pm</text>

        <!-- 01:00 -->
        <rect x="285" y="65" width="12" height="115" fill="#cbd5e1" rx="2"/>
        <rect x="299" y="75" width="12" height="105" fill="#0d9488" rx="2"/>
        <text x="298" y="194" fill="#64748b" font-size="9" text-anchor="middle">1pm</text>

        <!-- 02:00 -->
        <rect x="330" y="75" width="12" height="105" fill="#cbd5e1" rx="2"/>
        <rect x="344" y="90" width="12" height="90" fill="#0d9488" rx="2"/>
        <text x="343" y="194" fill="#64748b" font-size="9" text-anchor="middle">2pm</text>

        <!-- 03:00 -->
        <rect x="375" y="105" width="12" height="75" fill="#cbd5e1" rx="2"/>
        <rect x="389" y="120" width="12" height="60" fill="#0d9488" rx="2"/>
        <text x="388" y="194" fill="#64748b" font-size="9" text-anchor="middle">3pm</text>

        <!-- Legend -->
        <rect x="160" y="210" width="10" height="10" fill="#cbd5e1" rx="2"/>
        <text x="175" y="218" fill="#64748b" font-size="10">Scheduled</text>
        <rect x="250" y="210" width="10" height="10" fill="#0d9488" rx="2"/>
        <text x="265" y="218" fill="#64748b" font-size="10">Checked In</text>
      </g>

      <!-- Right Chart: Wait Times by Department -->
      <g transform="translate(466, 0)" filter="url(#shadow)">
        <rect width="446" height="230" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="16" y="24" fill="#0f172a" font-size="13" font-weight="700">Average Patient Wait Time (Minutes)</text>
        <text x="16" y="38" fill="#64748b" font-size="10">Check-in arrival to encounter start by department</text>

        <!-- Department 1: Urgent Care -->
        <g transform="translate(16, 56)">
          <text x="0" y="10" fill="#1e293b" font-size="11" font-weight="500">Urgent Care</text>
          <text x="414" y="10" fill="#0f766e" font-size="11" font-weight="700" text-anchor="end">28.4 mins</text>
          <rect y="16" width="414" height="8" rx="4" fill="#f1f5f9"/>
          <rect y="16" width="360" height="8" rx="4" fill="#f59e0b"/>
        </g>

        <!-- Department 2: Cardiology -->
        <g transform="translate(16, 90)">
          <text x="0" y="10" fill="#1e293b" font-size="11" font-weight="500">Cardiology</text>
          <text x="414" y="10" fill="#0f766e" font-size="11" font-weight="700" text-anchor="end">18.6 mins</text>
          <rect y="16" width="414" height="8" rx="4" fill="#f1f5f9"/>
          <rect y="16" width="240" height="8" rx="4" fill="#0d9488"/>
        </g>

        <!-- Department 3: Endocrinology -->
        <g transform="translate(16, 124)">
          <text x="0" y="10" fill="#1e293b" font-size="11" font-weight="500">Endocrinology</text>
          <text x="414" y="10" fill="#0f766e" font-size="11" font-weight="700" text-anchor="end">15.2 mins</text>
          <rect y="16" width="414" height="8" rx="4" fill="#f1f5f9"/>
          <rect y="16" width="195" height="8" rx="4" fill="#0d9488"/>
        </g>

        <!-- Department 4: Family Medicine -->
        <g transform="translate(16, 158)">
          <text x="0" y="10" fill="#1e293b" font-size="11" font-weight="500">Family Medicine</text>
          <text x="414" y="10" fill="#0f766e" font-size="11" font-weight="700" text-anchor="end">12.8 mins</text>
          <rect y="16" width="414" height="8" rx="4" fill="#f1f5f9"/>
          <rect y="16" width="165" height="8" rx="4" fill="#10b981"/>
        </g>

        <!-- Department 5: Pediatrics -->
        <g transform="translate(16, 192)">
          <text x="0" y="10" fill="#1e293b" font-size="11" font-weight="500">Pediatrics</text>
          <text x="414" y="10" fill="#0f766e" font-size="11" font-weight="700" text-anchor="end">9.5 mins</text>
          <rect y="16" width="414" height="8" rx="4" fill="#f1f5f9"/>
          <rect y="16" width="125" height="8" rx="4" fill="#10b981"/>
        </g>
      </g>
    </g>
  </g>
</svg>
