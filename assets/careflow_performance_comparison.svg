<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <text x="450" y="36" fill="#0f172a" font-size="18" font-weight="700" text-anchor="middle">Oracle Cost-Based Optimizer (CBO) Execution Plan Benchmark</text>
  <text x="450" y="56" fill="#64748b" font-size="12" text-anchor="middle">Measured CBO Cost &amp; Block Access Reductions via Covering B-Tree Indexing</text>

  <!-- Query 1 Panel -->
  <g transform="translate(60, 90)" filter="url(#shadow)">
    <rect width="360" height="280" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="20" y="30" fill="#0f172a" font-size="14" font-weight="700">Investigation 1: Wait Time Analytics</text>
    <text x="20" y="46" fill="#64748b" font-size="11">Report 02: APPOINTMENTS ⋈ ENCOUNTERS</text>

    <!-- Bar Comparison -->
    <!-- Baseline -->
    <rect x="50" y="100" width="80" height="130" fill="#f43f5e" rx="4"/>
    <text x="90" y="90" fill="#be123c" font-size="14" font-weight="700" text-anchor="middle">85 Cost</text>
    <text x="90" y="248" fill="#64748b" font-size="11" text-anchor="middle">Baseline</text>
    <text x="90" y="262" fill="#94a3b8" font-size="9" text-anchor="middle">(Full Table Scan)</text>

    <!-- Optimized -->
    <rect x="180" y="212" width="80" height="18" fill="#10b981" rx="4"/>
    <text x="220" y="202" fill="#047857" font-size="14" font-weight="700" text-anchor="middle">12 Cost</text>
    <text x="220" y="248" fill="#64748b" font-size="11" text-anchor="middle">Optimized</text>
    <text x="220" y="262" fill="#047857" font-size="9" font-weight="600" text-anchor="middle">(Covering Index)</text>

    <!-- Badge -->
    <rect x="250" y="20" width="90" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="295" y="36" fill="#059669" font-size="11" font-weight="700" text-anchor="middle">-85.8% Cost</text>
  </g>

  <!-- Query 2 Panel -->
  <g transform="translate(480, 90)" filter="url(#shadow)">
    <rect width="360" height="280" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="20" y="30" fill="#0f172a" font-size="14" font-weight="700">Investigation 2: Results Review Queue</text>
    <text x="20" y="46" fill="#64748b" font-size="11">Report 05: RESULTS ⋈ ORDERS (Abnormal Sort)</text>

    <!-- Bar Comparison -->
    <!-- Baseline -->
    <rect x="50" y="70" width="80" height="160" fill="#f43f5e" rx="4"/>
    <text x="90" y="60" fill="#be123c" font-size="14" font-weight="700" text-anchor="middle">112 Cost</text>
    <text x="90" y="248" fill="#64748b" font-size="11" text-anchor="middle">Baseline</text>
    <text x="90" y="262" fill="#94a3b8" font-size="9" text-anchor="middle">(Full Table Scan)</text>

    <!-- Optimized -->
    <rect x="180" y="204" width="80" height="26" fill="#10b981" rx="4"/>
    <text x="220" y="194" fill="#047857" font-size="14" font-weight="700" text-anchor="middle">18 Cost</text>
    <text x="220" y="248" fill="#64748b" font-size="11" text-anchor="middle">Optimized</text>
    <text x="220" y="262" fill="#047857" font-size="9" font-weight="600" text-anchor="middle">(Range Scan)</text>

    <!-- Badge -->
    <rect x="250" y="20" width="90" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="295" y="36" fill="#059669" font-size="11" font-weight="700" text-anchor="middle">-83.9% Cost</text>
  </g>
</svg>
