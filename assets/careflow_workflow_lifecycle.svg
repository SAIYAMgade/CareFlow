<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48"/>
    </marker>
  </defs>

  <text x="480" y="32" fill="#0f172a" font-size="18" font-weight="700" text-anchor="middle">Clinical Workflow State Machine &amp; Safety Enforcement Gate</text>
  <text x="480" y="50" fill="#64748b" font-size="11" text-anchor="middle">CareFlow Relational Transitions, Check-In Atomic Initialization, and Safety Rules</text>

  <!-- Step 1: Appointment Scheduled -->
  <g transform="translate(40, 100)" filter="url(#shadow)">
    <rect width="160" height="90" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect width="160" height="24" rx="8" fill="#2563eb"/>
    <text x="80" y="16" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">APPOINTMENT</text>
    <text x="80" y="48" fill="#1e3a8a" font-size="13" font-weight="700" text-anchor="middle">SCHEDULED</text>
    <text x="80" y="68" fill="#64748b" font-size="10" text-anchor="middle">Provider / Dept Booked</text>
    <text x="80" y="80" fill="#64748b" font-size="9" text-anchor="middle">MRN Validation</text>
  </g>

  <!-- Transition Arrow -->
  <path d="M200 145 h60" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="230" y="135" fill="#0d9488" font-size="10" font-weight="700" text-anchor="middle">Check-In</text>

  <!-- Step 2: Atomic Check-In + Open Encounter -->
  <g transform="translate(265, 80)" filter="url(#shadow)">
    <rect width="210" height="130" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="105" y="20" fill="#0f766e" font-size="10" font-weight="700" text-anchor="middle">ATOMIC PL/SQL TRANSACTION</text>
    
    <g transform="translate(15, 30)">
      <rect width="180" height="40" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="90" y="16" fill="#0f766e" font-size="10" font-weight="700" text-anchor="middle">Appt: CHECKED_IN</text>
      <text x="90" y="30" fill="#64748b" font-size="9" text-anchor="middle">check_in_time = SYSTIMESTAMP</text>
    </g>

    <g transform="translate(15, 78)">
      <rect width="180" height="40" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="90" y="16" fill="#0284c7" font-size="10" font-weight="700" text-anchor="middle">Encounter: OPEN</text>
      <text x="90" y="30" fill="#64748b" font-size="9" text-anchor="middle">Triage Station Initiated</text>
    </g>
  </g>

  <!-- Transition Arrow -->
  <path d="M475 145 h55" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="502" y="135" fill="#4f46e5" font-size="10" font-weight="700" text-anchor="middle">Exam</text>

  <!-- Step 3: Encounter In Progress / Orders Dispatched -->
  <g transform="translate(535, 100)" filter="url(#shadow)">
    <rect width="165" height="90" rx="8" fill="#fdf4ff" stroke="#f0abfc" stroke-width="1.5"/>
    <rect width="165" height="24" rx="8" fill="#a21caf"/>
    <text x="82" y="16" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">ENCOUNTER</text>
    <text x="82" y="48" fill="#701a75" font-size="13" font-weight="700" text-anchor="middle">IN_PROGRESS</text>
    <text x="82" y="68" fill="#64748b" font-size="10" text-anchor="middle">Orders: ORDERED</text>
    <text x="82" y="80" fill="#64748b" font-size="9" text-anchor="middle">Lab Requisitions (CBC/BMP)</text>
  </g>

  <!-- Safety Gate Block (Red Barrier) -->
  <g transform="translate(730, 75)">
    <rect width="190" height="140" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="2"/>
    <rect width="190" height="24" rx="8" fill="#e11d48"/>
    <text x="95" y="16" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">SAFETY ENFORCEMENT GATE</text>

    <!-- Blocked Branch -->
    <path d="M-30 70 h25" stroke="#e11d48" stroke-width="2" marker-end="url(#arrowRed)"/>
    <text x="95" y="48" fill="#9f1239" font-size="11" font-weight="700" text-anchor="middle">Signoff Blocked (ORA-20003)</text>
    <text x="95" y="66" fill="#be123c" font-size="9" text-anchor="middle">"Cannot complete encounter:</text>
    <text x="95" y="78" fill="#be123c" font-size="9" text-anchor="middle">pending lab orders exist"</text>

    <line x1="20" y1="92" x2="170" y2="92" stroke="#fda4af" stroke-dasharray="2,2"/>
    <text x="95" y="108" fill="#047857" font-size="10" font-weight="700" text-anchor="middle">Requirement to Pass:</text>
    <text x="95" y="124" fill="#047857" font-size="9" text-anchor="middle">All Orders -&gt; COMPLETED</text>
  </g>

  <!-- Step 4: Final Completed State (Bottom) -->
  <g transform="translate(535, 270)" filter="url(#shadow)">
    <rect width="385" height="85" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <rect width="385" height="24" rx="8" fill="#059669"/>
    <text x="192" y="16" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">WORKFLOW CONCLUDED &amp; SIGNED OFF</text>
    
    <text x="192" y="48" fill="#065f46" font-size="13" font-weight="700" text-anchor="middle">ENCOUNTER: COMPLETED • APPT: COMPLETED</text>
    <text x="192" y="66" fill="#047857" font-size="10" text-anchor="middle">Results Posted -&gt; Physician Signoff Logged -&gt; Audit Trail Immutable</text>
  </g>

  <!-- Downward Flow Line from Gate to Completed -->
  <path d="M825 215 v45" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="835" y="240" fill="#059669" font-size="10" font-weight="600">Lab Results Posted</text>
</svg>
